name: Temporary Node Runtime
run-name: runtime-${{ inputs.server_id }}

on:
  workflow_dispatch:
    inputs:
      server_id:
        description: Supabase server ID
        required: true
        type: string
      server_name:
        description: Display name
        required: false
        type: string
      startup_command:
        description: Startup command
        required: true
        type: string

permissions:
  contents: read

jobs:
  fetch-files:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Fetch files from Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SERVER_ID: ${{ inputs.server_id }}
        run: |
          node <<'NODE'
          const fs = require('node:fs/promises');
          const path = require('node:path');

          const base = process.env.SUPABASE_URL;
          const key = process.env.SUPABASE_SERVICE_ROLE_KEY;
          const serverId = process.env.SERVER_ID;

          if (!base || !key || !serverId) {
            throw new Error('Secret Supabase atau server ID kosong.');
          }

          async function request(url) {
            const response = await fetch(url, {
              headers: {
                apikey: key,
                Authorization: `Bearer ${key}`
              }
            });

            if (!response.ok) {
              throw new Error(
                `Supabase HTTP ${response.status}: ${await response.text()}`
              );
            }

            return response;
          }

          async function main() {
            const output = path.resolve('runtime-files');
            await fs.mkdir(output, { recursive: true });

            const url = new URL('/rest/v1/server_files', base);
            url.searchParams.set(
              'select',
              'name,storage_path,is_directory'
            );
            url.searchParams.set('server_id', `eq.${serverId}`);

            const rows = await (await request(url)).json();

            if (!Array.isArray(rows)) {
              throw new Error('Respons metadata Supabase tidak valid.');
            }

            const files = rows.filter(
              f => f.is_directory !== true && f.storage_path
            );

            if (files.length === 0) {
              throw new Error(
                'Tidak ada file. Periksa upload, server_id, dan storage_path.'
              );
            }

            if (files.length > 500) {
              throw new Error('Jumlah file melebihi batas 500.');
            }

            let total = 0;

            for (const file of files) {
              const storagePath = String(file.storage_path);
              const prefix = `${serverId}/`;

              if (!storagePath.startsWith(prefix)) {
                throw new Error(`Storage path tidak valid: ${file.name}`);
              }

              const relative = storagePath.slice(prefix.length);
              const parts = relative.split('/');

              if (
                !relative ||
                parts.some(p => !p || p === '.' || p === '..') ||
                path.isAbsolute(relative)
              ) {
                throw new Error(`Path file tidak aman: ${file.name}`);
              }

              const destination = path.resolve(output, relative);

              if (!destination.startsWith(output + path.sep)) {
                throw new Error('Path keluar dari direktori runtime.');
              }

              const objectPath = storagePath
                .split('/')
                .map(encodeURIComponent)
                .join('/');

              const fileUrl = new URL(
                `/storage/v1/object/server-files/${objectPath}`,
                base
              );

              const data = Buffer.from(
                await (await request(fileUrl)).arrayBuffer()
              );

              total += data.length;

              if (
                data.length > 20 * 1024 * 1024 ||
                total > 100 * 1024 * 1024
              ) {
                throw new Error('Ukuran file melewati batas runtime.');
              }

              await fs.mkdir(path.dirname(destination), {
                recursive: true
              });

              await fs.writeFile(destination, data);
            }

            console.log(`Berhasil mengambil ${files.length} file.`);
            console.log(`Total ukuran: ${total} bytes.`);
            console.log('File root:', await fs.readdir(output));
          }

          main().catch(error => {
            console.error(error);
            process.exit(1);
          });
          NODE

      - name: Upload runtime files
        uses: actions/upload-artifact@v4
        with:
          name: runtime-files
          path: runtime-files/
          if-no-files-found: error
          retention-days: 1

  execute:
    needs: fetch-files
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Download runtime files
        uses: actions/download-artifact@v4
        with:
          name: runtime-files
          path: runtime-files

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Show files and diagnose
        working-directory: runtime-files
        run: |
          echo "Runtime directory: $PWD"
          find . -maxdepth 3 -type f \
            ! -path './node_modules/*' | sort | head -200

      - name: Install dependencies
        working-directory: runtime-files
        run: |
          if [ -f package.json ]; then
            if [ -f package-lock.json ]; then
              npm ci
            else
              npm install
            fi
          else
            echo "::error::package.json tidak ada di root runtime."
            echo "Periksa lokasi folder bot dan startup command."
            exit 1
          fi

      - name: Start bot
        working-directory: runtime-files
        env:
          STARTUP_COMMAND: ${{ inputs.startup_command }}
        run: |
          if [ -z "$STARTUP_COMMAND" ]; then
            STARTUP_COMMAND="node index.js"
          fi

          echo "Menjalankan perintah startup..."
          bash -lc "$STARTUP_COMMAND"
