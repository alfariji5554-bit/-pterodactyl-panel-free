
name: Temporary Node Runtime

run-name: runtime-${{ inputs.server_id }}

on:
  workflow_dispatch:
    inputs:
      server_id:
        description: "Server ID"
        required: true
        type: string
      server_name:
        description: "Server name"
        required: true
        type: string
      startup_command:
        description: "Startup command"
        required: true
        type: string

permissions:
  contents: read
  actions: write

concurrency:
  group: runtime-${{ inputs.server_id }}
  cancel-in-progress: false

jobs:
  fetch-files:
    name: Prepare server files
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SERVER_ID: ${{ inputs.server_id }}

    steps:
      - name: Validate configuration
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SUPABASE_URL" || {
            echo "SUPABASE_URL belum diatur."
            exit 1
          }
          test -n "$SUPABASE_SERVICE_ROLE_KEY" || {
            echo "SUPABASE_SERVICE_ROLE_KEY belum diatur."
            exit 1
          }
          test -n "$SERVER_ID" || {
            echo "SERVER_ID kosong."
            exit 1
          }

      - name: Restore server files from Supabase
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p runtime-files
          touch runtime-files/.runtime-placeholder

          node <<'NODE'
          const fs = require("fs");
          const path = require("path");

          const base = process.env.SUPABASE_URL.replace(/\/+$/, "");
          const key = process.env.SUPABASE_SERVICE_ROLE_KEY;
          const sid = process.env.SERVER_ID;
          const root = path.resolve("runtime-files");

          async function request(url, options = {}) {
            const response = await fetch(url, {
              ...options,
              headers: {
                apikey: key,
                Authorization: `Bearer ${key}`,
                ...options.headers,
              },
              signal: AbortSignal.timeout(60000),
            });

            if (!response.ok) {
              throw new Error(
                `HTTP ${response.status}: ${(await response.text()).slice(0, 300)}`
              );
            }

            return response;
          }

          async function main() {
            let offset = 0;
            let restored = 0;

            while (true) {
              const params = new URLSearchParams({
                select: "path,name,is_directory,storage_path",
                server_id: `eq.${sid}`,
                is_directory: "eq.false",
                order: "path.asc",
                limit: "1000",
              });

              const response = await request(
                `${base}/rest/v1/server_files?${params}`,
                {
                  headers: {
                    Range: `${offset}-${offset + 999}`,
                    "Range-Unit": "items",
                  },
                }
              );

              const rows = await response.json();

              for (const row of rows) {
                const relative = String(row.path || "").replace(/^\/+/, "");
                const segments = relative.split("/");

                if (
                  !relative ||
                  path.isAbsolute(relative) ||
                  segments.some(part =>
                    !part || part === "." || part === ".." || part === ".git"
                  )
                ) {
                  console.warn(`Path tidak valid, dilewati: ${row.path}`);
                  continue;
                }

                const destination = path.resolve(root, relative);

                if (!destination.startsWith(root + path.sep)) {
                  console.warn(`Path di luar runtime, dilewati: ${row.path}`);
                  continue;
                }

                let storagePath = String(
                  row.storage_path || `${sid}/${relative}`
                ).replace(/^\/+/, "");

                // Pastikan file hanya diambil dari prefix server ini.
                if (!storagePath.startsWith(`${sid}/`)) {
                  storagePath = `${sid}/${relative}`;
                }

                const encodedPath = storagePath
                  .split("/")
                  .map(encodeURIComponent)
                  .join("/");

                const fileResponse = await request(
                  `${base}/storage/v1/object/server-files/${encodedPath}`
                );

                fs.mkdirSync(path.dirname(destination), {
                  recursive: true,
                });

                fs.writeFileSync(
                  destination,
                  Buffer.from(await fileResponse.arrayBuffer())
                );

                restored++;
                console.log(`Dipulihkan: ${relative}`);
              }

              if (rows.length < 1000) break;
              offset += rows.length;
            }

            console.log(`Total file dipulihkan: ${restored}`);
          }

          main().catch(error => {
            console.error(error.message);
            process.exit(1);
          });
          NODE

      - name: Upload runtime artifact
        uses: actions/upload-artifact@v4
        with:
          name: runtime-files-${{ inputs.server_id }}
          path: runtime-files/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  execute:
    name: Run server
    needs: fetch-files
    runs-on: ubuntu-latest
    timeout-minutes: 350

    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SERVER_ID: ${{ inputs.server_id }}
      SERVER_NAME: ${{ inputs.server_name }}
      STARTUP_COMMAND: ${{ inputs.startup_command }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download runtime artifact
        uses: actions/download-artifact@v4
        with:
          name: runtime-files-${{ inputs.server_id }}
          path: runtime-files

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Locate application
        id: locate
        shell: bash
        run: |
          set -euo pipefail

          ROOT="$GITHUB_WORKSPACE/runtime-files"

          PACKAGE_FILE="$(find "$ROOT" \
            -type d \( -name node_modules -o -name .git \) -prune -o \
            -type f -name package.json -print -quit)"

          if [[ -n "$PACKAGE_FILE" ]]; then
            APP_DIR="$(dirname "$PACKAGE_FILE")"
          else
            APP_DIR="$ROOT"
          fi

          echo "app_dir=$APP_DIR" >> "$GITHUB_OUTPUT"
          echo "Direktori aplikasi ditemukan."

      - name: Install synchronization helper
        shell: bash
        env:
          APP_DIR: ${{ steps.locate.outputs.app_dir }}
        run: |
          set -euo pipefail

          test -f "$GITHUB_WORKSPACE/sync-runtime-files.js" || {
            echo "sync-runtime-files.js tidak ditemukan di root repository."
            exit 1
          }

          cp "$GITHUB_WORKSPACE/sync-runtime-files.js" \
             "$APP_DIR/sync-runtime-files.js"

      - name: Install application dependencies
        working-directory: ${{ steps.locate.outputs.app_dir }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ -f package.json ]]; then
            if [[ -f package-lock.json ]]; then
              npm ci
            else
              npm install
            fi
          else
            echo "package.json tidak ditemukan; instalasi dilewati."
          fi

      - name: Locate environment file
        id: envfile
        shell: bash
        env:
          APP_DIR: ${{ steps.locate.outputs.app_dir }}
        run: |
          set -euo pipefail

          ROOT="$GITHUB_WORKSPACE/runtime-files"

          if [[ -f "$APP_DIR/.env" ]]; then
            echo "env_file=$APP_DIR/.env" >> "$GITHUB_OUTPUT"
            echo "File environment aplikasi ditemukan."
          elif [[ -f "$ROOT/.env" ]]; then
            echo "env_file=$ROOT/.env" >> "$GITHUB_OUTPUT"
            echo "File environment root ditemukan."
          else
            echo "env_file=" >> "$GITHUB_OUTPUT"
            echo "File .env tidak ditemukan; proses akan memakai environment yang tersedia."
          fi

      - name: Create runtime log collector
        working-directory: ${{ steps.locate.outputs.app_dir }}
        shell: bash
        run: |
          cat > runtime-log.js <<'NODE'
          const readline = require("readline");

          const base = (process.env.SUPABASE_URL || "").replace(/\/+$/, "");
          const key = process.env.SUPABASE_SERVICE_ROLE_KEY;
          const sid = process.env.SERVER_ID;

          const secrets = Object.entries(process.env)
            .filter(([name, value]) =>
              /TOKEN|SECRET|PASSWORD|API_KEY|PRIVATE_KEY/i.test(name) &&
              typeof value === "string" &&
              value.length >= 6
            )
            .map(([, value]) => value);

          function redact(message) {
            let result = message;

            for (const secret of secrets) {
              result = result.split(secret).join("[REDACTED]");
            }

            return result;
          }

          function level(message) {
            if (/\b(error|fatal|exception|failed)\b/i.test(message)) {
              return "error";
            }
            if (/\b(warn|warning)\b/i.test(message)) {
              return "warning";
            }
            if (/\b(debug|trace)\b/i.test(message)) {
              return "debug";
            }
            return "info";
          }

          let queue = [];
          let busy = false;

          async function flush() {
            if (busy || queue.length === 0) return;

            busy = true;
            const batch = queue.splice(0, 20);

            try {
              const response = await fetch(
                `${base}/rest/v1/runtime_logs`,
                {
                  method: "POST",
                  headers: {
                    apikey: key,
                    Authorization: `Bearer ${key}`,
                    "Content-Type": "application/json",
                    Prefer: "return=minimal",
                  },
                  body: JSON.stringify(
                    batch.map(message => ({
                      server_id: sid,
                      log_level: level(message),
                      message: message.slice(0, 8000),
                    }))
                  ),
                  signal: AbortSignal.timeout(15000),
                }
              );

              if (!response.ok) {
                const detail = (await response.text()).slice(0, 200);
                console.error(`Penyimpanan log gagal: HTTP ${response.status} ${detail}`);
                queue.unshift(...batch);
              }
            } catch (error) {
              console.error(`Koneksi log gagal: ${error.message}`);
              queue.unshift(...batch);
            } finally {
              // Batasi antrean agar tidak menghabiskan memori jika Supabase gagal.
              if (queue.length > 500) {
                queue = queue.slice(-500);
              }

              busy = false;
            }
          }

          const input = readline.createInterface({
            input: process.stdin,
            crlfDelay: Infinity,
          });

          input.on("line", line => {
            const message = redact(line);

            // Tampilkan log di GitHub Actions.
            console.log(message);

            queue.push(message);

            if (queue.length >= 20) {
              void flush();
            }
          });

          const timer = setInterval(() => {
            void flush();
          }, 2000);

          input.on("close", async () => {
            clearInterval(timer);

            while (busy || queue.length) {
              if (!busy) await flush();
              await new Promise(resolve => setTimeout(resolve, 100));
            }
          });
          NODE

      - name: Initial file synchronization
        working-directory: ${{ steps.locate.outputs.app_dir }}
        env:
          RUNTIME_ROOT: ${{ github.workspace }}/runtime-files
        shell: bash
        run: |
          set -euo pipefail
          node sync-runtime-files.js

      - name: Start periodic file synchronization
        id: sync
        working-directory: ${{ steps.locate.outputs.app_dir }}
        env:
          RUNTIME_ROOT: ${{ github.workspace }}/runtime-files
        shell: bash
        run: |
          set -euo pipefail

          SYNC_SCRIPT="$PWD/sync-runtime-files.js"
          SYNC_LOG="$RUNNER_TEMP/runtime-sync-${SERVER_ID}.log"

          (
            while true; do
              node "$SYNC_SCRIPT" >> "$SYNC_LOG" 2>&1 || true
              sleep 60
            done
          ) >/dev/null 2>&1 &

          echo "pid=$!" >> "$GITHUB_OUTPUT"
          echo "Sinkronisasi berkala dimulai."

      - name: Start server process
        id: server
        working-directory: ${{ steps.locate.outputs.app_dir }}
        env:
          LOGGER_PATH: ${{ steps.locate.outputs.app_dir }}/runtime-log.js
          ENV_FILE: ${{ steps.envfile.outputs.env_file }}
          RUNTIME_ROOT: ${{ github.workspace }}/runtime-files
        shell: bash
        run: |
          set +e

          if [[ -z "${STARTUP_COMMAND:-}" ]]; then
            echo "startup_command kosong."
            exit 1
          fi

          echo "Memulai server: $SERVER_NAME"
          echo "Direktori aplikasi: $PWD"

          if [[ -n "${ENV_FILE:-}" && -f "$ENV_FILE" ]]; then
            npx --yes dotenv-cli -e "$ENV_FILE" -- bash -c '
              bash -lc "$STARTUP_COMMAND" 2>&1 | node "$LOGGER_PATH"
              status=${PIPESTATUS[0]}
              exit "$status"
            '
            STATUS=$?
          else
            bash -lc "$STARTUP_COMMAND" 2>&1 | node "$LOGGER_PATH"
            STATUS=${PIPESTATUS[0]}
          fi

          echo "Proses server selesai dengan kode: $STATUS"
          exit "$STATUS"

      - name: Stop periodic synchronization
        if: always() && steps.sync.outputs.pid != ''
        shell: bash
        run: |
          PID="${{ steps.sync.outputs.pid }}"

          # Hentikan loop sinkronisasi sebelum sinkronisasi terakhir.
          pkill -TERM -P "$PID" 2>/dev/null || true
          kill "$PID" 2>/dev/null || true

      - name: Final file synchronization
        if: always() && steps.locate.outputs.app_dir != ''
        working-directory: ${{ steps.locate.outputs.app_dir }}
        env:
          RUNTIME_ROOT: ${{ github.workspace }}/runtime-files
        shell: bash
        run: |
          node sync-runtime-files.js
