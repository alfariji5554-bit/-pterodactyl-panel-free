
name: Temporary Node Runtime
run-name: runtime-${{ inputs.server_id }}

on:
  workflow_dispatch:
    inputs:
      server_id:
        description: Supabase server ID
        required: true
        type: string
      server_name:
        description: Bot/server name
        required: false
        type: string
      startup_command:
        description: Command to start the bot
        required: true
        type: string
        default: npm start

permissions:
  contents: read

jobs:
  fetch-files:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Validate Supabase settings
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          test -n "$SUPABASE_URL" || {
            echo "::error::Secret SUPABASE_URL belum diatur."
            exit 1
          }
          test -n "$SUPABASE_SERVICE_ROLE_KEY" || {
            echo "::error::Secret SUPABASE_SERVICE_ROLE_KEY belum diatur."
            exit 1
          }

      - name: Download bot files from Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SERVER_ID: ${{ inputs.server_id }}
        run: |
          node <<'NODE'
          const fs = require('node:fs/promises');
          const path = require('node:path');

          async function main() {
            const base = process.env.SUPABASE_URL;
            const key = process.env.SUPABASE_SERVICE_ROLE_KEY;
            const serverId = process.env.SERVER_ID;

            if (!base || !key || !serverId) {
              throw new Error('Konfigurasi Supabase atau server ID kosong.');
            }

            async function get(url) {
              const response = await fetch(url, {
                headers: {
                  apikey: key,
                  Authorization: `Bearer ${key}`
                }
              });

              if (!response.ok) {
                throw new Error(
                  `Supabase HTTP ${response.status}: ${await response.text()}`
                );
              }

              return response;
            }

            const metadataUrl = new URL('/rest/v1/server_files', base);
            metadataUrl.searchParams.set('select', 'name,storage_path,is_directory');
            metadataUrl.searchParams.set('server_id', `eq.${serverId}`);

            const metadata = await (await get(metadataUrl)).json();

            if (!Array.isArray(metadata)) {
              throw new Error('Metadata file Supabase tidak valid.');
            }

            const files = metadata.filter(
              f => f.is_directory !== true &&
                typeof f.storage_path === 'string' &&
                f.storage_path.length > 0
            );

            if (!files.length) {
              throw new Error(
                'Tidak ada file untuk server ini. Periksa server_id dan upload file.'
              );
            }

            if (files.length > 500) {
              throw new Error('Jumlah file melebihi batas 500.');
            }

            const root = path.resolve('runtime-files');
            await fs.mkdir(root, { recursive: true });

            let totalBytes = 0;

            for (const file of files) {
              const storagePath = file.storage_path;
              const prefix = `${serverId}/`;

              if (!storagePath.startsWith(prefix)) {
                throw new Error(`Storage path tidak sesuai server: ${file.name}`);
              }

              const relative = storagePath.slice(prefix.length);
              const parts = relative.split('/');

              if (
                !relative ||
                path.isAbsolute(relative) ||
                parts.some(p => !p || p === '.' || p === '..')
              ) {
                throw new Error(`Path file tidak aman: ${file.name}`);
              }

              const destination = path.resolve(root, relative);

              if (!destination.startsWith(root + path.sep)) {
                throw new Error('Path file keluar dari folder runtime.');
              }

              const encoded = storagePath
                .split('/')
                .map(encodeURIComponent)
                .join('/');

              const objectUrl = new URL(
                `/storage/v1/object/server-files/${encoded}`,
                base
              );

              const response = await get(objectUrl);
              const data = Buffer.from(await response.arrayBuffer());

              totalBytes += data.length;

              if (
                data.length > 20 * 1024 * 1024 ||
                totalBytes > 100 * 1024 * 1024
              ) {
                throw new Error('Ukuran file melewati batas runtime.');
              }

              await fs.mkdir(path.dirname(destination), {
                recursive: true
              });
              await fs.writeFile(destination, data);
            }

            console.log(`Berhasil mengunduh ${files.length} file.`);
            console.log(`Total ukuran: ${totalBytes} bytes.`);
          }

          main().catch(error => {
            console.error(error);
            process.exit(1);
          });
          NODE

      - name: Upload runtime artifact
        uses: actions/upload-artifact@v4
        with:
          name: runtime-files
          path: runtime-files/
          if-no-files-found: error
          retention-days: 1

  execute:
    needs: fetch-files
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Download runtime artifact
        uses: actions/download-artifact@v4
        with:
          name: runtime-files
          path: runtime-files

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Locate bot package
        id: locate
        shell: bash
        run: |
          set -euo pipefail

          echo "Mencari package.json..."
          find runtime-files -maxdepth 8 -type f \
            ! -path '*/node_modules/*' \
            | sort | head -250

          PACKAGE_JSON="$(
            find runtime-files -maxdepth 8 \
              -type f -name package.json \
              ! -path '*/node_modules/*' \
              -print -quit
          )"

          if [ -z "$PACKAGE_JSON" ]; then
            echo "::error::package.json tidak ditemukan."
            exit 1
          fi

          APP_DIR="$(dirname "$PACKAGE_JSON")"
          echo "app_dir=$APP_DIR" >> "$GITHUB_OUTPUT"
          echo "Folder aplikasi: $APP_DIR"

      - name: Install dependencies
        working-directory: ${{ steps.locate.outputs.app_dir }}
        run: |
          set -e

          if [ -f package-lock.json ]; then
            npm ci
          elif [ -f npm-shrinkwrap.json ]; then
            npm install
          else
            npm install
          fi

      - name: Prepare bot environment
        working-directory: ${{ steps.locate.outputs.app_dir }}
        env:
          BOT_TOKEN_SECRET: ${{ secrets.BOT_TOKEN }}
        run: |
          set -euo pipefail

          if [ -z "$BOT_TOKEN_SECRET" ]; then
            echo "::error::Secret BOT_TOKEN belum diatur di GitHub Actions."
            exit 1
          fi

          # Berikan token langsung ke proses bot.
          # Nilai secret tidak ditampilkan dalam log.
          {
            echo 'BOT_TOKEN<<GITHUB_BOT_TOKEN_EOF'
            printf '%s\n' "$BOT_TOKEN_SECRET"
            echo 'GITHUB_BOT_TOKEN_EOF'
          } >> "$GITHUB_ENV"

          # Jika .env tersedia, pastikan file tersebut tidak ditampilkan.
          if [ -f .env ]; then
            echo "File .env ditemukan."
          else
            echo "File .env tidak ada; BOT_TOKEN akan diberikan dari GitHub Secret."
          fi

          # Jangan mencetak isi .env karena mungkin berisi kredensial.

      - name: Start Telegram bot
        working-directory: ${{ steps.locate.outputs.app_dir }}
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          STARTUP_COMMAND: ${{ inputs.startup_command }}
        run: |
          set -euo pipefail

          if [ -z "$BOT_TOKEN" ]; then
            echo "::error::BOT_TOKEN kosong."
            exit 1
          fi

          if [ -z "$STARTUP_COMMAND" ]; then
            STARTUP_COMMAND="npm start"
          fi

          echo "Folder bot: $PWD"
          echo "Menjalankan startup command..."

          bash -lc "$STARTUP_COMMAND"
