
name: Temporary Node Runtime

run-name: runtime-${{ inputs.server_id }}

on:
  workflow_dispatch:
    inputs:
      server_id:
        description: "Server ID"
        required: true
        type: string
      server_name:
        description: "Server name"
        required: true
        type: string
      startup_command:
        description: "Startup command"
        required: true
        type: string

permissions:
  contents: read
  actions: write

concurrency:
  group: runtime-${{ inputs.server_id }}
  cancel-in-progress: false

jobs:
  fetch-files:
    name: Restore server files
    runs-on: ubuntu-latest
    timeout-minutes: 20

    outputs:
      should_run: ${{ steps.state.outputs.should_run }}

    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SERVER_ID: ${{ inputs.server_id }}

    steps:
      - name: Validate configuration
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SUPABASE_URL"
          test -n "$SUPABASE_SERVICE_ROLE_KEY"
          test -n "$SERVER_ID"

      - name: Check server state
        id: state
        shell: bash
        run: |
          set -euo pipefail

          node <<'NODE'
          const base = process.env.SUPABASE_URL.replace(/\/+$/, "");
          const key = process.env.SUPABASE_SERVICE_ROLE_KEY;
          const sid = process.env.SERVER_ID;

          async function main() {
            const params = new URLSearchParams({
              select: "id,status",
              id: `eq.${sid}`,
              limit: "1",
            });

            const response = await fetch(
              `${base}/rest/v1/servers?${params}`,
              {
                headers: {
                  apikey: key,
                  Authorization: `Bearer ${key}`,
                },
              }
            );

            if (!response.ok) {
              throw new Error(
                `Gagal memeriksa server: HTTP ${response.status}`
              );
            }

            const rows = await response.json();

            if (!rows.length) {
              throw new Error("Server tidak ditemukan di Supabase.");
            }

            const status = String(rows[0].status || "").toLowerCase();
            const stopped = [
              "stopped",
              "stopping",
              "suspended",
              "deleted",
            ].includes(status);

            const fs = require("fs");
            fs.appendFileSync(
              process.env.GITHUB_OUTPUT,
              `should_run=${stopped ? "false" : "true"}\n`
            );

            console.log(`Status server: ${status}`);

            if (stopped) {
              console.log("Server dihentikan. Runtime tidak akan dimulai.");
            }
          }

          main().catch(error => {
            console.error(error.message);
            process.exit(1);
          });
          NODE

      - name: Restore files from Supabase
        if: steps.state.outputs.should_run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p runtime-files
          touch runtime-files/.runtime-placeholder

          node <<'NODE'
          const fs = require("fs");
          const path = require("path");

          const base = process.env.SUPABASE_URL.replace(/\/+$/, "");
          const key = process.env.SUPABASE_SERVICE_ROLE_KEY;
          const sid = process.env.SERVER_ID;
          const root = path.resolve("runtime-files");

          async function request(url, options = {}) {
            const response = await fetch(url, {
              ...options,
              headers: {
                apikey: key,
                Authorization: `Bearer ${key}`,
                ...options.headers,
              },
              signal: AbortSignal.timeout(60000),
            });

            if (!response.ok) {
              throw new Error(
                `HTTP ${response.status}: ${(await response.text()).slice(0, 300)}`
              );
            }

            return response;
          }

          async function main() {
            let offset = 0;
            let restored = 0;

            while (true) {
              const params = new URLSearchParams({
                select: "path,name,is_directory,storage_path",
                server_id: `eq.${sid}`,
                is_directory: "eq.false",
                order: "path.asc",
                limit: "1000",
              });

              const response = await request(
                `${base}/rest/v1/server_files?${params}`,
                {
                  headers: {
                    Range: `${offset}-${offset + 999}`,
                    "Range-Unit": "items",
                  },
                }
              );

              const rows = await response.json();

              for (const row of rows) {
                const relative = String(row.path || "").replace(/^\/+/, "");
                const parts = relative.split("/");

                if (
                  !relative ||
                  path.isAbsolute(relative) ||
                  parts.some(part =>
                    !part || part === "." || part === ".." || part === ".git"
                  )
                ) {
                  console.warn(`Path tidak valid: ${row.path}`);
                  continue;
                }

                const destination = path.resolve(root, relative);

                if (!destination.startsWith(root + path.sep)) {
                  console.warn(`Path di luar runtime: ${row.path}`);
                  continue;
                }

                let storagePath = String(
                  row.storage_path || `${sid}/${relative}`
                ).replace(/^\/+/, "");

                if (!storagePath.startsWith(`${sid}/`)) {
                  storagePath = `${sid}/${relative}`;
                }

                const encoded = storagePath
                  .split("/")
                  .map(encodeURIComponent)
                  .join("/");

                const fileResponse = await request(
                  `${base}/storage/v1/object/server-files/${encoded}`
                );

                fs.mkdirSync(path.dirname(destination), {
                  recursive: true,
                });

                fs.writeFileSync(
                  destination,
                  Buffer.from(await fileResponse.arrayBuffer())
                );

                restored++;
                console.log(`Dipulihkan: ${relative}`);
              }

              if (rows.length < 1000) break;
              offset += rows.length;
            }

            console.log(`Total file dipulihkan: ${restored}`);
          }

          main().catch(error => {
            console.error(error.message);
            process.exit(1);
          });
          NODE

      - name: Upload runtime files
        if: steps.state.outputs.should_run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: runtime-files-${{ inputs.server_id }}
          path: runtime-files/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  execute:
    name: Run server with auto-restart
    needs: fetch-files
    if: needs.fetch-files.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 350

    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SERVER_ID: ${{ inputs.server_id }}
      SERVER_NAME: ${{ inputs.server_name }}
      STARTUP_COMMAND: ${{ inputs.startup_command }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download restored files
        uses: actions/download-artifact@v4
        with:
          name: runtime-files-${{ inputs.server_id }}
          path: runtime-files

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Locate application
        id: locate
        shell: bash
        run: |
          set -euo pipefail

          ROOT="$GITHUB_WORKSPACE/runtime-files"

          PACKAGE_FILE="$(find "$ROOT" \
            -type d \( -name node_modules -o -name .git \) -prune -o \
            -type f -name package.json -print -quit)"

          if [[ -n "$PACKAGE_FILE" ]]; then
            APP_DIR="$(dirname "$PACKAGE_FILE")"
          else
            APP_DIR="$ROOT"
          fi

          echo "app_dir=$APP_DIR" >> "$GITHUB_OUTPUT"
          echo "Direktori aplikasi ditemukan."

      - name: Install sync helper
        env:
          APP_DIR: ${{ steps.locate.outputs.app_dir }}
        shell: bash
        run: |
          set -euo pipefail

          test -f "$GITHUB_WORKSPACE/sync-runtime-files.js"

          cp "$GITHUB_WORKSPACE/sync-runtime-files.js" \
            "$APP_DIR/sync-runtime-files.js"

      - name: Install application dependencies
        working-directory: ${{ steps.locate.outputs.app_dir }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ -f package-lock.json ]]; then
            npm ci
          elif [[ -f package.json ]]; then
            npm install
          else
            echo "package.json tidak ditemukan."
          fi

      - name: Locate .env
        id: envfile
        env:
          APP_DIR: ${{ steps.locate.outputs.app_dir }}
        shell: bash
        run: |
          set -euo pipefail

          ROOT="$GITHUB_WORKSPACE/runtime-files"

          if [[ -f "$APP_DIR/.env" ]]; then
            echo "env_file=$APP_DIR/.env" >> "$GITHUB_OUTPUT"
            echo ".env aplikasi ditemukan."
          elif [[ -f "$ROOT/.env" ]]; then
            echo "env_file=$ROOT/.env" >> "$GITHUB_OUTPUT"
            echo ".env root ditemukan."
          else
            echo "env_file=" >> "$GITHUB_OUTPUT"
            echo ".env tidak ditemukan."
          fi

      - name: Create runtime log collector
        working-directory: ${{ steps.locate.outputs.app_dir }}
        shell: bash
        run: |
          cat > runtime-log.js <<'NODE'
          const readline = require("readline");

          const base = (process.env.SUPABASE_URL || "").replace(/\/+$/, "");
          const key = process.env.SUPABASE_SERVICE_ROLE_KEY;
          const sid = process.env.SERVER_ID;

          const secrets = Object.entries(process.env)
            .filter(([name, value]) =>
              /TOKEN|SECRET|PASSWORD|API_KEY|PRIVATE_KEY/i.test(name) &&
              typeof value === "string" &&
              value.length >= 6
            )
            .map(([, value]) => value);

          function redact(message) {
            for (const secret of secrets) {
              message = message.split(secret).join("[REDACTED]");
            }
            return message;
          }

          function level(message) {
            if (/\b(error|fatal|exception|failed)\b/i.test(message)) return "error";
            if (/\b(warn|warning)\b/i.test(message)) return "warning";
            if (/\b(debug|trace)\b/i.test(message)) return "debug";
            return "info";
          }

          let queue = [];
          let busy = false;
          let closing = false;

          async function flush() {
            if (busy || queue.length === 0) return;

            busy = true;
            const batch = queue.splice(0, 20);

            try {
              const response = await fetch(`${base}/rest/v1/runtime_logs`, {
                method: "POST",
                headers: {
                  apikey: key,
                  Authorization: `Bearer ${key}`,
                  "Content-Type": "application/json",
                  Prefer: "return=minimal",
                },
                body: JSON.stringify(batch.map(message => ({
                  server_id: sid,
                  log_level: level(message),
                  message: message.slice(0, 8000),
                }))),
                signal: AbortSignal.timeout(15000),
              });

              if (!response.ok) {
                console.error(`Penyimpanan log gagal: HTTP ${response.status}`);
                if (!closing) queue.unshift(...batch);
              }
            } catch (error) {
              console.error(`Koneksi log gagal: ${error.message}`);
              if (!closing) queue.unshift(...batch);
            } finally {
              if (queue.length > 500) queue = queue.slice(-500);
              busy = false;
            }
          }

          const input = readline.createInterface({
            input: process.stdin,
            crlfDelay: Infinity,
          });

          input.on("line", line => {
            const message = redact(line);
            console.log(message);
            queue.push(message);
            if (queue.length >= 20) void flush();
          });

          const timer = setInterval(() => void flush(), 2000);

          input.on("close", async () => {
            closing = true;
            clearInterval(timer);

            let attempts = 0;

            while (!busy && queue.length && attempts < 3) {
              attempts++;
              await flush();
              if (queue.length) {
                await new Promise(resolve => setTimeout(resolve, 500));
              }
            }
          });
          NODE

      - name: Initial file sync
        working-directory: ${{ steps.locate.outputs.app_dir }}
        env:
          RUNTIME_ROOT: ${{ github.workspace }}/runtime-files
        shell: bash
        run: node sync-runtime-files.js

      - name: Start periodic file sync
        id: sync
        working-directory: ${{ steps.locate.outputs.app_dir }}
        env:
          RUNTIME_ROOT: ${{ github.workspace }}/runtime-files
        shell: bash
        run: |
          set -euo pipefail

          (
            while true; do
              node sync-runtime-files.js || true
              sleep 60
            done
          ) >/dev/null 2>&1 &

          echo "pid=$!" >> "$GITHUB_OUTPUT"

      - name: Run bot and restart after exit
        working-directory: ${{ steps.locate.outputs.app_dir }}
        env:
          ENV_FILE: ${{ steps.envfile.outputs.env_file }}
          LOGGER_PATH: ${{ steps.locate.outputs.app_dir }}/runtime-log.js
          RUNTIME_ROOT: ${{ github.workspace }}/runtime-files
        shell: bash
        run: |
          set -uo pipefail

          if [[ -z "${STARTUP_COMMAND:-}" ]]; then
            echo "startup_command kosong."
            exit 1
          fi

          while true; do
            echo "Memulai bot: $SERVER_NAME"

            if [[ -n "${ENV_FILE:-}" && -f "$ENV_FILE" ]]; then
              npx --yes dotenv-cli -e "$ENV_FILE" -- \
                bash -c '
                  bash -lc "$STARTUP_COMMAND" 2>&1 | node "$LOGGER_PATH"
                  exit "${PIPESTATUS[0]}"
                '
              STATUS=$?
            else
              bash -lc "$STARTUP_COMMAND" 2>&1 | node "$LOGGER_PATH"
              STATUS=${PIPESTATUS[0]}
            fi

            echo "Bot berhenti dengan kode $STATUS."
            echo "Restart dalam 10 detik."
            sleep 10
          done

      - name: Stop periodic file sync
        if: always() && steps.sync.outputs.pid != ''
        shell: bash
        run: |
          PID="${{ steps.sync.outputs.pid }}"
          pkill -TERM -P "$PID" 2>/dev/null || true
          kill "$PID" 2>/dev/null || true

      - name: Final file sync
        if: always() && steps.locate.outputs.app_dir != ''
        working-directory: ${{ steps.locate.outputs.app_dir }}
        env:
          RUNTIME_ROOT: ${{ github.workspace }}/runtime-files
        shell: bash
        run: |
          node sync-runtime-files.js || true

  schedule-continuation:
    name: Schedule next runtime cycle
    needs: fetch-files
    if: needs.fetch-files.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 340

    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SERVER_ID: ${{ inputs.server_id }}
      SERVER_NAME: ${{ inputs.server_name }}
      STARTUP_COMMAND: ${{ inputs.startup_command }}
      GH_TOKEN: ${{ github.token }}
      REPOSITORY: ${{ github.repository }}
      WORKFLOW_REF: ${{ github.ref_name }}

    steps:
      - name: Wait before next runtime cycle
        shell: bash
        run: |
          echo "Runtime berikutnya dijadwalkan sekitar 320 menit."
          sleep 19200

      - name: Dispatch next runtime if server is still enabled
        shell: bash
        run: |
          set -euo pipefail

          node <<'NODE'
          const base = process.env.SUPABASE_URL.replace(/\/+$/, "");
          const serviceKey = process.env.SUPABASE_SERVICE_ROLE_KEY;
          const sid = process.env.SERVER_ID;

          async function main() {
            const params = new URLSearchParams({
              select: "id,status",
              id: `eq.${sid}`,
              limit: "1",
            });

            const check = await fetch(
              `${base}/rest/v1/servers?${params}`,
              {
                headers: {
                  apikey: serviceKey,
                  Authorization: `Bearer ${serviceKey}`,
                },
              }
            );

            if (!check.ok) {
              throw new Error("Gagal memeriksa status server di Supabase.");
            }

            const rows = await check.json();

            if (!rows.length) {
              console.log("Server tidak ditemukan; tidak menjadwalkan ulang.");
              return;
            }

            const status = String(rows[0].status || "").toLowerCase();

            if ([
              "stopped",
              "stopping",
              "suspended",
              "deleted",
            ].includes(status)) {
              console.log(`Server berstatus ${status}; siklus berikutnya dibatalkan.`);
              return;
            }

            const [owner, repo] = process.env.REPOSITORY.split("/");
            const workflow = "runtime.yml";

            const response = await fetch(
              `https://api.github.com/repos/${owner}/${repo}/actions/workflows/${workflow}/dispatches`,
              {
                method: "POST",
                headers: {
                  Authorization: `Bearer ${process.env.GH_TOKEN}`,
                  Accept: "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28",
                  "Content-Type": "application/json",
                },
                body: JSON.stringify({
                  ref: process.env.WORKFLOW_REF,
                  inputs: {
                    server_id: process.env.SERVER_ID,
                    server_name: process.env.SERVER_NAME,
                    startup_command: process.env.STARTUP_COMMAND,
                  },
                }),
              }
            );

            if (!response.ok) {
              throw new Error(
                `Gagal menjadwalkan runtime berikutnya: HTTP ${response.status} ${(await response.text()).slice(0, 300)}`
              );
            }

            console.log("Siklus runtime berikutnya berhasil dijadwalkan.");
          }

          main().catch(error => {
            console.error(error.message);
            process.exit(1);
          });
          NODE
