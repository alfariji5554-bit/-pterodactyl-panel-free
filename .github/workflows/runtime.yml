
name: Temporary Node Runtime
run-name: runtime-${{ inputs.server_id }}

on:
  workflow_dispatch:
    inputs:
      server_id:
        description: Supabase server ID
        required: true
        type: string
      server_name:
        description: Display name
        required: false
        type: string
      startup_command:
        description: Startup command, dijalankan dari folder package.json
        required: true
        type: string
        default: node index.js

permissions:
  contents: read

jobs:
  fetch-files:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Fetch files from Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SERVER_ID: ${{ inputs.server_id }}
        run: |
          node <<'NODE'
          const fs = require('node:fs/promises');
          const path = require('node:path');
          const { execFileSync } = require('node:child_process');

          const base = process.env.SUPABASE_URL;
          const key = process.env.SUPABASE_SERVICE_ROLE_KEY;
          const serverId = process.env.SERVER_ID;

          if (!base || !key || !serverId) {
            throw new Error(
              'Secret SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY, atau server ID kosong.'
            );
          }

          async function request(url) {
            const response = await fetch(url, {
              headers: {
                apikey: key,
                Authorization: `Bearer ${key}`
              }
            });

            if (!response.ok) {
              throw new Error(
                `Supabase HTTP ${response.status}: ${await response.text()}`
              );
            }

            return response;
          }

          async function main() {
            const output = path.resolve('runtime-files');
            await fs.mkdir(output, { recursive: true });

            const url = new URL('/rest/v1/server_files', base);
            url.searchParams.set(
              'select',
              'name,storage_path,is_directory'
            );
            url.searchParams.set('server_id', `eq.${serverId}`);

            const rows = await (await request(url)).json();

            if (!Array.isArray(rows)) {
              throw new Error('Respons metadata Supabase tidak valid.');
            }

            const files = rows.filter(
              file =>
                file.is_directory !== true &&
                typeof file.storage_path === 'string' &&
                file.storage_path.length > 0
            );

            if (files.length === 0) {
              throw new Error(
                'Tidak ada file. Periksa upload, server_id, dan storage_path.'
              );
            }

            if (files.length > 500) {
              throw new Error('Jumlah file melebihi batas 500.');
            }

            let total = 0;

            for (const file of files) {
              const storagePath = file.storage_path;
              const prefix = `${serverId}/`;

              if (!storagePath.startsWith(prefix)) {
                throw new Error(
                  `Storage path tidak valid: ${file.name}`
                );
              }

              const relative = storagePath.slice(prefix.length);
              const parts = relative.split('/');

              if (
                !relative ||
                parts.some(
                  part =>
                    !part ||
                    part === '.' ||
                    part === '..'
                ) ||
                path.isAbsolute(relative)
              ) {
                throw new Error(
                  `Path file tidak aman: ${file.name}`
                );
              }

              const destination = path.resolve(output, relative);

              if (!destination.startsWith(output + path.sep)) {
                throw new Error(
                  'Path file keluar dari direktori runtime.'
                );
              }

              const objectPath = storagePath
                .split('/')
                .map(encodeURIComponent)
                .join('/');

              const fileUrl = new URL(
                `/storage/v1/object/server-files/${objectPath}`,
                base
              );

              const response = await request(fileUrl);
              const data = Buffer.from(
                await response.arrayBuffer()
              );

              total += data.length;

              if (
                data.length > 20 * 1024 * 1024 ||
                total > 100 * 1024 * 1024
              ) {
                throw new Error(
                  'Ukuran file melewati batas runtime.'
                );
              }

              await fs.mkdir(path.dirname(destination), {
                recursive: true
              });

              await fs.writeFile(destination, data);
            }

            console.log(`Berhasil mengambil ${files.length} file.`);
            console.log(`Total ukuran: ${total} bytes.`);
            console.log('Struktur file runtime:');

            execFileSync(
              'find',
              [
                output,
                '-maxdepth', '5',
                '-type', 'f',
                '-not', '-path', '*/node_modules/*'
              ],
              { stdio: 'inherit' }
            );
          }

          main().catch(error => {
            console.error(error);
            process.exit(1);
          });
          NODE

      - name: Upload runtime files
        uses: actions/upload-artifact@v4
        with:
          name: runtime-files
          path: runtime-files/
          if-no-files-found: error
          retention-days: 1

  execute:
    needs: fetch-files
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Download runtime files
        uses: actions/download-artifact@v4
        with:
          name: runtime-files
          path: runtime-files

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Find bot folder
        id: locate
        shell: bash
        run: |
          set -euo pipefail

          echo "Mencari package.json..."
          find runtime-files \
            -maxdepth 5 \
            -type f \
            ! -path '*/node_modules/*' \
            | sort \
            | head -250

          PACKAGE_JSON="$(
            find runtime-files \
              -maxdepth 5 \
              -type f \
              -name package.json \
              ! -path '*/node_modules/*' \
              -print -quit
          )"

          if [ -z "$PACKAGE_JSON" ]; then
            echo "::error::package.json tidak ditemukan di runtime-files atau subfolder."
            exit 1
          fi

          APP_DIR="$(dirname "$PACKAGE_JSON")"

          echo "app_dir=$APP_DIR" >> "$GITHUB_OUTPUT"
          echo "Folder bot ditemukan: $APP_DIR"

      - name: Install dependencies
        working-directory: ${{ steps.locate.outputs.app_dir }}
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Start bot
        working-directory: ${{ steps.locate.outputs.app_dir }}
        env:
          STARTUP_COMMAND: ${{ inputs.startup_command }}
        run: |
          set -e

          if [ -z "$STARTUP_COMMAND" ]; then
            STARTUP_COMMAND="node index.js"
          fi

          echo "Folder bot: $PWD"
          echo "Menjalankan startup command..."

          bash -lc "$STARTUP_COMMAND"
