
name: Temporary Node Runtime

run-name: runtime-${{ inputs.server_id }}

on:
  workflow_dispatch:
    inputs:
      server_id:
        description: "Server ID"
        required: true
        type: string
      server_name:
        description: "Server name"
        required: true
        type: string
      startup_command:
        description: "Startup command"
        required: true
        type: string

permissions:
  contents: read
  actions: write

concurrency:
  group: runtime-${{ inputs.server_id }}
  cancel-in-progress: false

jobs:
  fetch-files:
    name: Prepare server files
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SERVER_ID: ${{ inputs.server_id }}

    steps:
      - uses: actions/checkout@v4

      - name: Validate configuration
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SUPABASE_URL" || { echo "SUPABASE_URL belum diatur."; exit 1; }
          test -n "$SUPABASE_SERVICE_ROLE_KEY" || { echo "SUPABASE_SERVICE_ROLE_KEY belum diatur."; exit 1; }
          test -n "$SERVER_ID" || { echo "SERVER_ID kosong."; exit 1; }

      - name: Download server files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p runtime-files

          node <<'NODE'
          const fs = require("fs");
          const path = require("path");

          const base = process.env.SUPABASE_URL.replace(/\/+$/, "");
          const key = process.env.SUPABASE_SERVICE_ROLE_KEY;
          const sid = process.env.SERVER_ID;
          const root = path.resolve("runtime-files");

          async function request(url) {
            const r = await fetch(url, {
              headers: {
                apikey: key,
                Authorization: `Bearer ${key}`,
              },
            });

            if (!r.ok) {
              throw new Error(`HTTP ${r.status}: ${(await r.text()).slice(0, 300)}`);
            }

            return r;
          }

          async function main() {
            const params = new URLSearchParams({
              select: "path,name,is_directory,storage_path",
              server_id: `eq.${sid}`,
              is_directory: "eq.false",
              order: "path.asc",
            });

            const r = await request(`${base}/rest/v1/server_files?${params}`);
            const rows = await r.json();
            let count = 0;

            for (const row of rows) {
              const relative = String(row.path || "").replace(/^\/+/, "");

              if (
                !relative ||
                relative.split("/").some(p =>
                  !p || p === "." || p === ".." || p === ".git"
                ) ||
                path.isAbsolute(relative)
              ) {
                console.warn(`Path dilewati: ${row.path}`);
                continue;
              }

              const dest = path.resolve(root, relative);

              if (!dest.startsWith(root + path.sep)) {
                console.warn(`Path di luar direktori dilewati: ${row.path}`);
                continue;
              }

              const objectPath = String(
                row.storage_path || `${sid}/${relative}`
              ).replace(/^\/+/, "");

              const encoded = objectPath
                .split("/")
                .map(encodeURIComponent)
                .join("/");

              const fileResponse = await request(
                `${base}/storage/v1/object/server-files/${encoded}`
              );

              fs.mkdirSync(path.dirname(dest), { recursive: true });
              fs.writeFileSync(
                dest,
                Buffer.from(await fileResponse.arrayBuffer())
              );

              count++;
              console.log(`Diunduh: ${relative}`);
            }

            console.log(`Total file dipulihkan: ${count}`);
          }

          main().catch(e => {
            console.error(e.message);
            process.exit(1);
          });
          NODE

      - uses: actions/upload-artifact@v4
        with:
          name: runtime-files-${{ inputs.server_id }}
          path: runtime-files/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 1

  execute:
    name: Run server
    needs: fetch-files
    runs-on: ubuntu-latest
    timeout-minutes: 350

    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SERVER_ID: ${{ inputs.server_id }}
      SERVER_NAME: ${{ inputs.server_name }}
      STARTUP_COMMAND: ${{ inputs.startup_command }}
      BOT_TOKEN_SECRET: ${{ secrets.BOT_TOKEN }}

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: runtime-files-${{ inputs.server_id }}
          path: runtime-files

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Locate application
        id: locate
        shell: bash
        run: |
          set -euo pipefail

          ROOT="$GITHUB_WORKSPACE/runtime-files"
          PACKAGE_FILE="$(find "$ROOT" \
            -type d \( -name node_modules -o -name .git \) -prune -o \
            -type f -name package.json -print -quit)"

          if [[ -n "$PACKAGE_FILE" ]]; then
            APP_DIR="$(dirname "$PACKAGE_FILE")"
          else
            APP_DIR="$ROOT"
          fi

          echo "app_dir=$APP_DIR" >> "$GITHUB_OUTPUT"
          echo "Direktori aplikasi: $APP_DIR"

      - name: Install dependencies
        working-directory: ${{ steps.locate.outputs.app_dir }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ -f package-lock.json ]]; then
            npm ci
          elif [[ -f package.json ]]; then
            npm install
          else
            echo "package.json tidak ditemukan; instalasi dilewati."
          fi

      - name: Prepare bot environment
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "${BOT_TOKEN_SECRET:-}" ]]; then
            echo "Secret BOT_TOKEN belum diatur."
            exit 1
          fi

          {
            echo "BOT_TOKEN<<BOT_TOKEN_EOF"
            printf '%s\n' "$BOT_TOKEN_SECRET"
            echo "BOT_TOKEN_EOF"
          } >> "$GITHUB_ENV"

      - name: Create runtime log collector
        working-directory: ${{ steps.locate.outputs.app_dir }}
        shell: bash
        run: |
          cat > runtime-log.js <<'NODE'
          const readline = require("readline");

          const base = (process.env.SUPABASE_URL || "").replace(/\/+$/, "");
          const key = process.env.SUPABASE_SERVICE_ROLE_KEY;
          const sid = process.env.SERVER_ID;
          const secret = process.env.BOT_TOKEN_SECRET || "";

          let queue = [];
          let busy = false;

          function redact(s) {
            return secret ? s.split(secret).join("[REDACTED]") : s;
          }

          function level(s) {
            if (/\b(error|fatal|exception|failed)\b/i.test(s)) return "error";
            if (/\b(warn|warning)\b/i.test(s)) return "warning";
            if (/\b(debug|trace)\b/i.test(s)) return "debug";
            return "info";
          }

          async function flush() {
            if (busy || queue.length === 0) return;

            busy = true;
            const batch = queue.splice(0, 20);

            try {
              const r = await fetch(`${base}/rest/v1/runtime_logs`, {
                method: "POST",
                headers: {
                  apikey: key,
                  Authorization: `Bearer ${key}`,
                  "Content-Type": "application/json",
                  Prefer: "return=minimal",
                },
                body: JSON.stringify(batch.map(message => ({
                  server_id: sid,
                  log_level: level(message),
                  message: message.slice(0, 8000),
                }))),
              });

              if (!r.ok) {
                console.error(
                  `Log Supabase gagal: ${r.status} ${(await r.text()).slice(0, 300)}`
                );
                queue.unshift(...batch);
              }
            } catch (e) {
              console.error(`Log error: ${e.message}`);
              queue.unshift(...batch);
            } finally {
              busy = false;
              if (queue.length) {
                setTimeout(() => void flush(), 1000);
              }
            }
          }

          const input = readline.createInterface({
            input: process.stdin,
            crlfDelay: Infinity,
          });

          input.on("line", line => {
            const message = redact(line);
            console.log(message);
            queue.push(message);
            if (queue.length >= 20) void flush();
          });

          input.on("close", async () => {
            while (busy || queue.length) {
              if (!busy) await flush();
              await new Promise(resolve => setTimeout(resolve, 100));
            }
          });
          NODE

      - name: Create persistent file synchronization helper
        working-directory: ${{ steps.locate.outputs.app_dir }}
        shell: bash
        run: |
          cat > sync-runtime-files.js <<'NODE'
          const fs = require("fs");
          const path = require("path");
          const crypto = require("crypto");

          const base = (process.env.SUPABASE_URL || "").replace(/\/+$/, "");
          const key = process.env.SUPABASE_SERVICE_ROLE_KEY;
          const sid = process.env.SERVER_ID;
          const root = path.resolve(process.env.RUNTIME_ROOT || process.cwd());

          const ignored = new Set([
            ".git",
            "node_modules",
            ".next",
            ".turbo",
            ".cache",
          ]);

          const helperFiles = new Set([
            "runtime-log.js",
            "sync-runtime-files.js",
          ]);

          const uploadedHashes = new Map();
          let syncing = false;

          async function request(url, options = {}) {
            let lastError;

            for (let attempt = 1; attempt <= 3; attempt++) {
              try {
                const r = await fetch(url, {
                  ...options,
                  headers: {
                    apikey: key,
                    Authorization: `Bearer ${key}`,
                    ...options.headers,
                  },
                  signal: AbortSignal.timeout(60000),
                });

                if (r.ok) return r;

                const message =
                  `HTTP ${r.status}: ${(await r.text()).slice(0, 300)}`;

                if (r.status < 500 && r.status !== 429) {
                  throw new Error(message);
                }

                lastError = new Error(message);
              } catch (e) {
                lastError = e;
              }

              if (attempt < 3) {
                await new Promise(resolve => setTimeout(resolve, attempt * 1500));
              }
            }

            throw lastError || new Error("Request gagal.");
          }

          function walk(dir, out = []) {
            for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
              const full = path.join(dir, entry.name);
              const rel = path.relative(root, full).split(path.sep).join("/");
              const parts = rel.split("/");

              if (
                parts.some(p => ignored.has(p) || p.startsWith(".env")) ||
                helperFiles.has(path.basename(rel)) ||
                entry.isSymbolicLink()
              ) {
                continue;
              }

              if (entry.isDirectory()) {
                walk(full, out);
              } else if (entry.isFile()) {
                out.push({ full, rel });
              }
            }

            return out;
          }

          async function sync() {
            if (syncing) {
              console.log("Sinkronisasi sebelumnya masih berjalan; dilewati.");
              return;
            }

            syncing = true;

            try {
              if (!base || !key || !sid) {
                throw new Error("Konfigurasi Supabase tidak lengkap.");
              }

              const files = walk(root);
              let uploaded = 0;
              let skipped = 0;
              let totalBytes = 0;
              const maxFileSize = 20 * 1024 * 1024;
              const maxBatchBytes = 100 * 1024 * 1024;

              for (const file of files) {
                let content;

                try {
                  content = fs.readFileSync(file.full);
                } catch (e) {
                  console.warn(`File gagal dibaca: ${file.rel}: ${e.message}`);
                  continue;
                }

                if (content.length > maxFileSize) {
                  console.warn(`File lebih dari 20 MB dilewati: ${file.rel}`);
                  continue;
                }

                const hash = crypto
                  .createHash("sha256")
                  .update(content)
                  .digest("hex");

                if (uploadedHashes.get(file.rel) === hash) {
                  skipped++;
                  continue;
                }

                if (totalBytes + content.length > maxBatchBytes) {
                  console.warn(
                    "Batas 100 MB per putaran tercapai; file sisanya dicoba pada putaran berikutnya."
                  );
                  break;
                }

                const storagePath = `${sid}/${file.rel}`;
                const encoded = storagePath
                  .split("/")
                  .map(encodeURIComponent)
                  .join("/");

                await request(
                  `${base}/storage/v1/object/server-files/${encoded}`,
                  {
                    method: "POST",
                    headers: {
                      "Content-Type": "application/octet-stream",
                      "x-upsert": "true",
                    },
                    body: content,
                  }
                );

                const row = {
                  server_id: sid,
                  path: file.rel.replace(/^\/+/, ""),
                  name: path.basename(file.rel),
                  is_directory: false,
                  size_bytes: content.length,
                  mime_type: "application/octet-stream",
                  storage_path: storagePath,
                  updated_at: new Date().toISOString(),
                };

                const params = new URLSearchParams({
                  on_conflict: "server_id,path",
                });

                await request(
                  `${base}/rest/v1/server_files?${params}`,
                  {
                    method: "POST",
                    headers: {
                      "Content-Type": "application/json",
                      Prefer: "resolution=merge-duplicates,return=minimal",
                    },
                    body: JSON.stringify(row),
                  }
                );

                uploadedHashes.set(file.rel, hash);
                totalBytes += content.length;
                uploaded++;

                console.log(`Tersimpan: ${file.rel}`);
              }

              console.log(
                `Sinkronisasi selesai. File baru/berubah: ${uploaded}; tidak berubah: ${skipped}.`
              );
            } catch (e) {
              console.error(`Sinkronisasi gagal: ${e.message}`);
            } finally {
              syncing = false;
            }
          }

          if (require.main === module) {
            sync().catch(e => {
              console.error(e.message);
              process.exitCode = 1;
            });
          }

          module.exports = { sync };
          NODE

      - name: Start periodic file synchronization
        id: sync
        working-directory: ${{ steps.locate.outputs.app_dir }}
        env:
          RUNTIME_ROOT: ${{ github.workspace }}/runtime-files
        shell: bash
        run: |
          set -euo pipefail

          (
            while true; do
              node sync-runtime-files.js
              sleep 15
            done
          ) &
          echo "pid=$!" >> "$GITHUB_OUTPUT"

      - name: Initial file synchronization
        working-directory: ${{ steps.locate.outputs.app_dir }}
        env:
          RUNTIME_ROOT: ${{ github.workspace }}/runtime-files
        shell: bash
        run: node sync-runtime-files.js

      - name: Start server process
        working-directory: ${{ steps.locate.outputs.app_dir }}
        env:
          RUNTIME_ROOT: ${{ github.workspace }}/runtime-files
        shell: bash
        run: |
          set -uo pipefail

          if [[ -z "${STARTUP_COMMAND:-}" ]]; then
            echo "startup_command kosong."
            exit 1
          fi

          echo "Memulai server: $SERVER_NAME"
          echo "Folder aplikasi: $PWD"

          set +e
          bash -lc "$STARTUP_COMMAND" 2>&1 | node runtime-log.js
          STATUS=${PIPESTATUS[0]}
          set -e

          echo "Proses server selesai dengan kode: $STATUS"
          exit "$STATUS"

      - name: Stop periodic synchronization
        if: always() && steps.sync.outputs.pid != ''
        shell: bash
        run: |
          PID="${{ steps.sync.outputs.pid }}"
          kill "$PID" 2>/dev/null || true
          pkill -P "$PID" 2>/dev/null || true

      - name: Final file synchronization
        if: always() && steps.locate.outputs.app_dir != ''
        working-directory: ${{ steps.locate.outputs.app_dir }}
        env:
          RUNTIME_ROOT: ${{ github.workspace }}/runtime-files
        shell: bash
        run: |
          node sync-runtime-files.js
